# Outside agent on Fly.io: one always-on machine. Built remotely from a bundle dir containing a
# Dockerfile and the prebuilt outside-agent binary (see scripts/deploy-fly.sh).
app = "a2a-outside-dlott"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  REFRESH_SECS = "600"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
